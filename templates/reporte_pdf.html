<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            body { margin: 0; padding: 20px; }
            .no-print { display: none; }
        }
        table { font-size: 12px; }
        th { background-color: #2d6a4f; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h2>{{ titulo }}</h2>
            <p>Generado el {{ fecha_generacion.strftime('%d/%m/%Y %H:%M') }} - Total: {{ total_registros }} registros</p>
        </div>
        {% if grafico_estados %}
        <div class="text-center">
            <img src="{{ grafico_estados }}" style="max-width: 100%;">
        </div>
        {% endif %}
        {{ tabla_html|safe }}
        <div class="text-muted mt-4 small">
            Reporte generado por Villa Cutupú - Sistema Municipal
        </div>
    </div>
    <div class="text-center no-print mt-4">
        <button class="btn btn-primary" onclick="window.print()">Imprimir / Guardar PDF</button>
    </div>
</body>
</html>
