{% extends "base.html" %}

{% block title %}Completa tu Registro - Villa Cutupú{% endblock %}

{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:2rem; margin-top:var(--header-h);">
    <div style="background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); padding:3rem; width:100%; max-width:480px;">
        
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="width:70px;height:70px;background:linear-gradient(135deg,#1a3b2e,#2e7d5e);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                <i class="fas fa-user-check" style="color:white;font-size:1.8rem;"></i>
            </div>
            <h1 style="color:#1a3b2e;font-size:1.8rem;margin-bottom:0.5rem;">¡Casi listo!</h1>
            <p style="color:#666;">Solo necesitamos un dato más para crear tu cuenta</p>
        </div>

        <div style="background:#f8f9fa;border-radius:12px;padding:1rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:1rem;border:1px solid #e0e0e0;">
            <i class="fab fa-google" style="color:#DB4437;font-size:1.5rem;"></i>
            <div>
                <div style="font-weight:700;color:#333;">{{ nombre }} {{ apellidos }}</div>
                <div style="font-size:0.85rem;color:#666;">{{ email }}</div>
            </div>
        </div>

        <form method="POST" action="{{ url_for('auth.registro_completo') }}">
            <div style="margin-bottom:1.2rem;">
                <label style="display:block;font-weight:600;color:#333;margin-bottom:0.5rem;">Nombre</label>
                <input type="text" value="{{ nombre }}" disabled style="width:100%;padding:0.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#f8f9fa;color:#888;">
            </div>
            <div style="margin-bottom:1.2rem;">
                <label style="display:block;font-weight:600;color:#333;margin-bottom:0.5rem;">Apellidos</label>
                <input type="text" value="{{ apellidos }}" disabled style="width:100%;padding:0.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#f8f9fa;color:#888;">
            </div>
            <div style="margin-bottom:1.2rem;">
                <label style="display:block;font-weight:600;color:#333;margin-bottom:0.5rem;">Email</label>
                <input type="email" value="{{ email }}" disabled style="width:100%;padding:0.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#f8f9fa;color:#888;">
            </div>
            <div style="margin-bottom:1.5rem;">
                <label style="display:block;font-weight:600;color:#333;margin-bottom:0.5rem;">
                    <i class="fas fa-phone" style="color:#1a3b2e;"></i> Teléfono (opcional)
                </label>
                <input type="tel" name="telefono" placeholder="809-555-1234" style="width:100%;padding:0.8rem 1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;font-family:inherit;transition:border-color 0.3s;" onfocus="this.style.borderColor='#2e7d5e'" onblur="this.style.borderColor='#e0e0e0'">
            </div>
            <button type="submit" style="width:100%;padding:1rem;background:linear-gradient(135deg,#1a3b2e,#2e7d5e);color:white;border:none;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.8rem;">
                <i class="fas fa-check-circle"></i> Completar Registro
            </button>
        </form>
    </div>
</div>
{% endblock %}
