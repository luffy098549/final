<div class="modal" id="modalPlantillas" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;justify-content:center;align-items:center;">
    <div style="background:white;border-radius:16px;width:90%;max-width:700px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;">
        <div style="padding:1.25rem 1.5rem;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between;align-items:center;">
            <h3 style="margin:0;font-size:1.1rem;"><i class="fas fa-file-alt"></i> Seleccionar Plantilla</h3>
            <button onclick="cerrarModalPlantillas()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#667085;">&times;</button>
        </div>
        <div style="padding:1rem 1.5rem;overflow-y:auto;flex:1;">
            <input type="text" id="buscarPlantilla" placeholder="Buscar plantillas..." 
                   style="width:100%;padding:.6rem 1rem;border:1px solid #d0d5dd;border-radius:8px;margin-bottom:1rem;font-size:.95rem;">
            <div id="listaPlantillasModal">
                <p style="color:#667085;text-align:center;">Cargando plantillas...</p>
            </div>
        </div>
    </div>
</div>

<script>
let _plantillasCache = [];

function abrirSelectorPlantillas(tipo) {
    window.plantillaTipo = tipo;
    window.plantillaCampo = 'comentarioText';
    
    const modal = document.getElementById('modalPlantillas');
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    
    // Cargar plantillas desde la BD
    fetch('/admin/api/plantillas-lista')
        .then(r => r.json())
        .then(data => {
            _plantillasCache = data;
            _renderPlantillas(data);
        })
        .catch(() => {
            document.getElementById('listaPlantillasModal').innerHTML = 
                '<p style="color:#667085;text-align:center;">No hay plantillas disponibles.</p>';
        });
}

function _renderPlantillas(lista) {
    const container = document.getElementById('listaPlantillasModal');
    if (!lista || lista.length === 0) {
        container.innerHTML = '<p style="color:#667085;text-align:center;padding:2rem;">No hay plantillas en esta categoría</p>';
        return;
    }
    container.innerHTML = lista.map(p => `
        <div onclick="insertarPlantilla('${p.contenido.replace(/'/g, "\\'").replace(/\n/g, "\\n")}')"
             style="background:#f9fafb;border:1px solid #e4e7ec;border-radius:10px;padding:1rem;margin-bottom:.6rem;cursor:pointer;transition:all .2s;"
             onmouseover="this.style.borderColor='#2e7d5e';this.style.background='#e8f3ee';"
             onmouseout="this.style.borderColor='#e4e7ec';this.style.background='#f9fafb';">
            <div style="font-weight:600;color:#1a3b2e;margin-bottom:.3rem;">${p.nombre}</div>
            <div style="font-size:.85rem;color:#667085;">${p.contenido.substring(0,120)}...</div>
            <div style="margin-top:.4rem;">
                <span style="background:#e8f3ee;color:#1a3b2e;padding:.1rem .6rem;border-radius:20px;font-size:.75rem;">${p.categoria}</span>
            </div>
        </div>
    `).join('');
}

function cerrarModalPlantillas() {
    document.getElementById('modalPlantillas').style.display = 'none';
    document.body.style.overflow = '';
}

function insertarPlantilla(contenido) {
    const campo = document.getElementById(window.plantillaCampo || 'comentarioText');
    if (campo) {
        campo.value = contenido.replace(/\\n/g, '\n');
        campo.focus();
    }
    cerrarModalPlantillas();
}

document.getElementById('buscarPlantilla')?.addEventListener('input', function() {
    const term = this.value.toLowerCase();
    const filtradas = _plantillasCache.filter(p => 
        p.nombre.toLowerCase().includes(term) || 
        p.contenido.toLowerCase().includes(term)
    );
    _renderPlantillas(filtradas);
});

document.getElementById('modalPlantillas')?.addEventListener('click', function(e) {
    if (e.target === this) cerrarModalPlantillas();
});
</script>
